name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run Tests
        run: dotnet test --no-build --no-restore

      - name: Verify generator output is up to date
        run: |
          dotnet run --project src/Fes.Generator -- \
            --schema schema/elasticsearch-schema.json \
            --output src/Fes/Generated \
            --fsproj src/Fes/Fes.fsproj \
            --test-output tests/Fes.Tests
          if [ -n "$(git diff --name-only src/Fes/Generated/ tests/Fes.Tests/Generated/)" ]; then
            echo "Generated files are out of date. Run the generator and commit the results."
            git diff --stat src/Fes/Generated/ tests/Fes.Tests/Generated/
            exit 1
          fi
          echo "Generated files are up to date."
