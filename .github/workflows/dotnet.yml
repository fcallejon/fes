name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# NOTE: Elasticsearch 9.x service container is configured below in the build job.

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -qE 'yellow|green'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Verify generator output is up to date
        run: |
          dotnet run --project src/Fes.Generator -- \
            --schema schema/elasticsearch-schema.json \
            --output src/Fes/Generated \
            --fsproj src/Fes/Fes.fsproj \
            --test-output tests/Fes.Tests
          if [ -n "$(git diff --name-only src/Fes/Generated/ tests/Fes.Tests/Generated/ src/Fes/Fes.fsproj)" ]; then
            echo "Generated files are out of date. Run the generator and commit the results."
            git diff --stat src/Fes/Generated/ tests/Fes.Tests/Generated/ src/Fes/Fes.fsproj
            exit 1
          fi
          echo "Generated files are up to date."

      - name: Run Tests
        run: dotnet test --no-build --no-restore
